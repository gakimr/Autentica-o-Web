<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="auth-layout">
    <section class="auth-card">
      <p class="titulo">PROJETO ACADÊMICO · PoC</p>
      <h1>Bem-vindo de volta</h1>
      <p class="texto-suave">Entre com seus dados para continuar.</p>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="full-button">Entrar</button>
      </form>

      <p id="message" class="message" role="status"></p>
      <p class="switch-page">Ainda não tem uma conta? <a href="/">Cadastre-se</a></p>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
